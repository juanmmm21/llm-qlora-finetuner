[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-qlora-finetuner"
version = "0.1.0"
description = "LoRA/QLoRA fine-tuning: NF4 quantization and low-rank adapters in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["llm_qlora_finetuner"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
